<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imperial Terminal — Bounty</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #FFD307;
    --red: #FF0000;
    --gold-bright: #FEE141;
    --white: #FFFFFF;
    --grey: #D9D9D9;
    --grey-mid: #757575;
    --black: #000000;
    --panel-bg: #0a0a0a;
    --outer-bg: #1a1a1a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--black);
    font-family: 'JetBrains Mono', monospace;
    color: var(--white);
    min-height: 100vh;
    margin: 0;
    padding: 0;
  }
  .frame {
    position: relative;
    z-index: 1;
    background: transparent;
    width: 100%;
    min-height: 100vh;
    padding: 20px 32px;
    border-radius: 0;
  }

  /* ===== TOP NAV ===== */
  .navbar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr 1fr;
    border-bottom: 1px solid #2a2a2a;
    margin-bottom: 20px;
  }
  .navbar a {
    color: var(--white);
    text-decoration: none;
    text-align: center;
    padding: 14px 0;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    position: relative;
    clip-path: polygon(6% 0%, 100% 0%, 94% 100%, 0% 100%);
    margin-right: -1px;
  }
  .navbar a.active {
    background: var(--white);
    color: var(--black);
    font-weight: 700;
    z-index: 2;
  }

  /* ===== BOUNTY PAGE ===== */
  .bounty-page {
    max-width: 1000px;
    margin: 0 auto;
  }

  .stat-strip {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0;
    margin-bottom: 0px;
    margin-top: 40px;
  }
  .arrow {
    color: var(--red);
    font-size: 26px;
    flex: 0 0 auto;
    padding: 0 14px;
    user-select: none;
    text-shadow: 0 0 8px rgba(255, 7, 7, 0.6);
  }
  .stat-bar {
    position: relative;
    flex: 1;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    background: rgba(10,10,10,0.28);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 7, 7, 0.35);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.2), 0 8px 30px rgba(0,0,0,0.35);
  }
  .stat-bar::before {
    content: "";
    position: absolute;
    top: -1px; left: -1px;
    width: 16px; height: 16px;
    border-top: 2px solid var(--red);
    border-left: 2px solid var(--red);
  }
  .stat-bar::after {
    content: "";
    position: absolute;
    top: -1px; right: -1px;
    width: 16px; height: 16px;
    border-top: 2px solid var(--red);
    border-right: 2px solid var(--red);
  }
  .stat-cell {
    position: relative;
    text-align: center;
    padding: 22px 10px;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--red);
    font-weight: 700;
    border-right: 1px dashed rgba(255, 7, 7, 0.25);
    text-transform: uppercase;
  }
  .stat-cell:last-child { border-right: none; }

  .hazard-tag {
    width: 20%;
    margin-left: 44px;
    height: 16px;
    background: repeating-linear-gradient(
      45deg,
      var(--red),
      var(--red) 14px,
      #000 14px,
      #000 28px
    );
    box-shadow: 0 0 10px rgba(255, 7, 7, 0.4);
    position: relative;
    z-index: 2;
  }

  .hero {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: #050505;
    overflow: hidden;
    z-index: 0;
    cursor: pointer;
  }
  
  .hero video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  .hero-name {
    position: fixed;
    left: 32px;
    bottom: 30px;
    color: var(--red);
    font-size: 44px;
    font-weight: 800;
    line-height: 1.05;
    letter-spacing: 1px;
    text-shadow: 0 2px 12px rgba(0,0,0,0.8);
    margin: 0;
    z-index: 1;
    text-transform: uppercase;
    pointer-events: none;
  }

  .collect-btn {
    position: fixed;
    right: 32px;
    bottom: 34px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(20,16,0,0.85);
    border: 1px dashed var(--red);
    padding: 14px 22px;
    cursor: pointer;
    z-index: 1;
    text-decoration: none;
    transition: background 0.2s ease;
  }
  .collect-btn:hover {
    background: rgba(255, 7, 7, 0.2);
  }
  .collect-btn .dots {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .collect-btn .dots span {
    width: 4px;
    height: 4px;
    background: var(--red);
    border-radius: 50%;
    display: block;
  }
  .collect-btn .label {
    color: var(--red);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    line-height: 1.3;
  }
  .collect-btn::before,
  .collect-btn::after {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    border-color: var(--red);
    border-style: solid;
  }
  .collect-btn::before {
    top: -1px; left: -1px;
    border-width: 2px 0 0 2px;
  }
  .collect-btn::after {
    bottom: -1px; right: -1px;
    border-width: 0 2px 2px 0;
  }

  /* ===== DISABLED STATE (CLAIMED) ===== */
  .collect-btn.disabled {
    background: rgba(30, 30, 30, 0.85);
    border-color: var(--grey-mid);
    cursor: not-allowed;
    pointer-events: none;
    opacity: 0.75;
  }
  .collect-btn.disabled .dots span {
    background: var(--grey-mid);
  }
  .collect-btn.disabled .label {
    color: var(--grey-mid);
  }
  .collect-btn.disabled::before,
  .collect-btn.disabled::after {
    border-color: var(--grey-mid);
  }
</style>
<link rel="stylesheet" href="{{ url_for('static', filename='css/crt.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
</head>
<body>

<div class="frame">

  <!-- BACKGROUND HERO VIDEO -->
  <div class="hero" id="heroContainer">
    <video id="heroVideo" muted playsinline preload="auto">
      <source src="{{ url_for('static', filename='switch.webm') }}" type="video/webm">
      Your browser does not support the video tag.
    </video>
  </div>

  <!-- NAVIGATION BAR -->
  <div class="navbar">
    <a href="{{ url_for('home') }}" class="active">Home</a>
    <a href="{{ url_for('services') }}">Services</a>
    <a href="{{ url_for('admin') }}">Admin</a>
    <a href="{{ url_for('military') }}">Military</a>
    <a href="{{ url_for('report') }}">Report</a>
  </div>

  <div class="bounty-page">

    <!-- STAT STRIP -->
    <div class="stat-strip">
      <span class="arrow">&lt;</span>
      <div class="stat-bar">
        <div class="stat-cell">TARGET</div>
        <div class="stat-cell">ACTIVE</div>
        <div class="stat-cell">DEATH</div>
        <div class="stat-cell">∞ CREDITS</div>
        <div class="stat-cell">HIGHEST PRIORITY</div>
      </div>
      <span class="arrow">&gt;</span>
    </div>
    <div class="hazard-tag"></div>

    <!-- TARGET NAME -->
    <h1 class="hero-name">
        DARTH<br>VADER
    </h1>

  </div>

</div>

<script src="{{ url_for('static', filename='js/crt.js') }}" defer></script>
<script>
  document.addEventListener('DOMContentLoaded', () => {
    const heroContainer = document.getElementById('heroContainer');
    const heroVideo = document.getElementById('heroVideo');
    let totalClicks = 0;
    let typedSequence = '';
    let isBlocked = false;

    // Detect when the word "block" is typed
    window.addEventListener('keydown', (e) => {
      typedSequence += e.key.toLowerCase();
      
      if (typedSequence.length > 5) {
        typedSequence = typedSequence.slice(-5);
      }

      if (typedSequence === 'block') {
        isBlocked = true;
        totalClicks = 0; // Reset accumulated clicks
        typedSequence = '';
      }
    });

    // Handle clicks anywhere on the hero element
    heroContainer.addEventListener('click', () => {
      // If blocked, ignore this specific click and unblock for future clicks
      if (isBlocked) {
        isBlocked = false;
        return;
      }

      totalClicks++;

      // Trigger video playback on the second successful click
      if (totalClicks === 2) {
        heroVideo.play().catch(error => {
          console.error("Playback error:", error);
        });
        totalClicks = 0;
      }
    });
  });
</script>
</body>
</html>
